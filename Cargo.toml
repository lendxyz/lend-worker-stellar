[package]
name = "lend_worker_stellar"
version = "0.4.0"
edition = "2024"

[workspace]
members = [
    "crates/lw-config",
    "crates/lw-domain",
    "crates/lw-storage",
    "crates/lw-chain",
    "crates/lw-app",
]

# The crate ships no real doctests (the only doc comments that rustdoc would
# treat as doctests are the `sol!` definitions, now in lw-config).
[lib]
doctest = false

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
strip = true
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3

# The binary itself only needs bootstrap (logging/env/heartbeat) deps + the
# workspace layer crates. Everything else moved into those crates; the few deps
# used solely by the integration tests live in [dev-dependencies] below.
[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
eyre = "0.6.14"
fern = { version = "0.7.1", features = ["colored"] }
itertools = "0.15.0"
log = "0.4.34"
reqwest = "0.13.5"
tokio = { version = "1.54.1", features = ["full"] }
lw-config = { path = "crates/lw-config" }
lw-domain = { path = "crates/lw-domain" }
lw-storage = { path = "crates/lw-storage" }
lw-chain = { path = "crates/lw-chain" }
lw-app = { path = "crates/lw-app" }

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
async-trait = "0.1.92"
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
stellar-xdr = { version = "30.0.0", features = ["std", "base64"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "json"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
