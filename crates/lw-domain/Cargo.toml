[package]
name = "lw-domain"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "json"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
lw-config = { path = "../lw-config" }
