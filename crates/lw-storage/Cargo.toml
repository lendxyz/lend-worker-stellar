[package]
name = "lw-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
eyre = "0.6.14"
log = "0.4.34"
once_cell = "1.21.4"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "json"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
lw-config = { path = "../lw-config" }
lw-domain = { path = "../lw-domain" }
