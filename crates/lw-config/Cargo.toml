[package]
name = "lw-config"
version = "0.1.0"
edition = "2024"

# The `sol!` event definitions in src/types.rs carry Solidity-style doc
# comments that rustdoc would otherwise extract as (non-compiling) doctests.
[lib]
doctest = false

[dependencies]
stellar-rpc-client = "30.0.0"
eyre = "0.6.14"
once_cell = "1.21.4"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
