[package]
name = "lw-chain"
version = "0.1.0"
edition = "2024"

[dependencies]
stellar-xdr = { version = "30.0.0", features = ["std", "base64"] }
stellar-rpc-client = "30.0.0"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
eyre = "0.6.14"
log = "0.4.34"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
lw-config = { path = "../lw-config" }
lw-domain = { path = "../lw-domain" }
lw-storage = { path = "../lw-storage" }
gcp-bigquery-client = { version = "0.28", default-features = false, features = ["native-tls", "ring", "gzip"] }
